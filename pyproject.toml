[project]
name = "svg-keychain-3mf"
version = "0.1.1"
description = "Turn flat-colour SVGs (like flag maps) into multi-colour 3MF keychains, plaques and magnets for Bambu Studio."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "shapely>=2.1",
    "trimesh>=4.0",
    "svgpathtools>=1.6",
    # trimesh picks a triangulator at run time; pin the permissively licensed one.
    "mapbox-earcut>=1.0",
]
keywords = ["3d-printing", "svg", "3mf", "bambu-studio", "multicolour", "keychain", "ams"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
# Higher-fidelity SVG reading (clips, masks, overlapping strokes). Needs the system Cairo library.
render = ["cairosvg>=2.7", "opencv-python-headless>=4.8", "pillow>=13.0"]

[project.scripts]
svg-keychain = "svg_keychain_3mf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svg_keychain_3mf"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/triage/tests"]
