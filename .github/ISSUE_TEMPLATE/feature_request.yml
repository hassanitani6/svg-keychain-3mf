name: Feature request
description: Suggest an improvement or a new output type.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Please don't include personal details or designs you can't share.
  - type: textarea
    id: want
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: A concrete print you are trying to make helps most.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround, if any
