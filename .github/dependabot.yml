# Proposes pull requests when pinned GitHub Actions publish new versions.
# Nothing merges automatically; review the release notes and the new SHA first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
